services:
  db:
    image: postgres:17-alpine
    container_name: mylifediary-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mylifediary
      POSTGRES_USER: mylifediary
      POSTGRES_PASSWORD: mylifediary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mylifediary -d mylifediary"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mylifediary:local
    container_name: mylifediary-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mylifediary
      SPRING_DATASOURCE_USERNAME: mylifediary
      SPRING_DATASOURCE_PASSWORD: mylifediary
    ports:
      - "8080:8080"

volumes:
  pgdata:

